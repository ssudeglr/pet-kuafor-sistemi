<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>PetShop - Çalışanlar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="user-info"><i class="fa fa-user-circle"></i> <span id="empNameDisplay">Çalışan</span></div>
            <ul>
                <li><a href="dashboard.html"><i class="fa fa-home"></i> Ana Sayfa</a></li>
                <li><a href="products.html"><i class="fa fa-box"></i> Ürünler</a></li>
                <li class="active"><a href="employees.html"><i class="fa fa-users"></i> Çalışanlar</a></li>
                <li><a href="customers.html"><i class="fa fa-user-tag"></i> Müşteriler</a></li>
                <li><a href="billing.html"><i class="fa fa-file-invoice"></i> Faturalandırma</a></li>
                <li class="logout"><a href="#" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Çıkış</a></li>
            </ul>
        </nav>

        <main class="content">
            <h2>Çalışan Yönetimi</h2>
            <div class="form-section">
                <div class="form-row">
                    <input type="text" id="empName" placeholder="Çalışan Adı">
                    <input type="date" id="empDOB">
                    <input type="text" id="empPhone" placeholder="Telefon Numarası">
                </div>
                <div class="form-row">
                    <input type="password" id="empPass" placeholder="Şifre">
                    <input type="text" id="empAdd" placeholder="Adres">
                </div>
                <div class="btn-row">
                    <button class="btn-save" onclick="saveEmployee()">Kaydet</button>
                    <button class="btn-edit" onclick="editEmployee()">Düzenle</button>
                    <button class="btn-delete" onclick="deleteEmployee()">Sil</button>
                </div>
            </div>
            <table>
                <thead><tr><th>ID</th><th>Adı</th><th>Adresi</th><th>Doğum Tarihi</th><th>Telefon</th><th>Şifre</th></tr></thead>
                <tbody id="employeeList"></tbody>
            </table>
        </main>
    </div>
    <script src="../js/app.js"></script>
    <script src="../js/employees.js"></script> </body>
</body>
</html>
