<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Management - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">

    <!-- PREMIUM AESTHETIC EFFECTS: Floating Orbs (Gereksizse bu 4 satırı tamamen silebilirsiniz) -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="icon-box">
                <i class="fa fa-paw"></i> </div>
            <h2>Pet Shop Management</h2>
        </div>
        
        <div class="login-form" id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Admin">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password">
            </div>
            
            <button class="btn-login" onclick="login()">LOGIN</button>
            <div class="forgot-password-link">
                <a href="#" onclick="toggleForgotPasswordForm(true); return false;">Şifremi Unuttum</a>
            </div>
        </div>

        <div class="forgot-form" id="forgotForm" style="display: none;">
            <div class="input-group">
                <label for="forgot-username">Kullanıcı Adı</label>
                <input type="text" id="forgot-username" placeholder="Admin">
            </div>
            
            <div class="input-group">
                <label for="forgot-phone">Telefon Numarası</label>
                <input type="text" id="forgot-phone">
            </div>

            <div class="input-group">
                <label for="forgot-new-password">Yeni Şifre</label>
                <input type="password" id="forgot-new-password">
            </div>
            
            <button class="btn-login" onclick="resetPassword()">Şifreyi Güncelle</button>
            <button class="btn-secondary" style="margin-top: 5px;" onclick="toggleForgotPasswordForm(false)">Geri Dön</button>
        </div>
    </div>

    <!-- Modern Custom Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
